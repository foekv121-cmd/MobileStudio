              ("COL_TOPBAR = 0xFF353535;", "COL_TOPBAR = 0xFF171B27;"),
              ("COL_DIVIDER = 0xFF292A2E;", "COL_DIVIDER = 0xFF232A3C;"),
              ("COL_CARD = 0xFF2C2D32;", "COL_CARD = 0xFF1A1F2E;"),
              ("COL_NAV_ACTIVE = 0xFF000000;", "COL_NAV_ACTIVE = 0xFF222B45;"),
              ("COL_CTA_BLUE = 0xFF3E65F5;", "COL_CTA_BLUE = 0xFF5B8DEF;"),
              ("COL_PLUS_BLUE = 0xFF4769E1;", "COL_PLUS_BLUE = 0xFF5B8DEF;"),
