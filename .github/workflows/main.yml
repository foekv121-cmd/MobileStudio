              ("COL_SEE_ALL_TEXT = 0xFF949599;", "COL_SEE_ALL_TEXT = 0xFF8F99B1;"),
              ("COL_BADGE_BG = 0xFF050508;", "COL_BADGE_BG = 0xFF0B0D13;"),
