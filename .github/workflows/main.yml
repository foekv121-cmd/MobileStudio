name: Build Modified APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build and sign modified APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Apply my changes (Aurora look, open buttons, mesh errors, stretchy balls, animation fix, quick publish, UI redesign)
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import sys, re
          from pathlib import Path

          BASE = Path("app/src/main/java/com/goydevv/studrblx")

          def edit(rel, old, new, count=1):
              p = BASE / rel
              s = p.read_text(encoding="utf-8")
              n = s.count(old)
              if n != count:
                  sys.exit("PATCH FAILED: %s expected %d match(es) of %r but found %d" % (rel, count, old[:70], n))
              p.write_text(s.replace(old, new), encoding="utf-8")
              print("ok:", rel, "-", old[:50].strip())

          # 1) New "Aurora" theme, listed first.
          edit("core/Theme.java",
           "    private static final List<Theme> builtIn = CollectionsKt.listOf(new Theme[]{DARK, LIGHT, MIDNIGHT, HIGH_CONTRAST});",
           "    private static final Theme AURORA = new Theme(\"Aurora\", false, 0xFF0F1117, 0xFF151923, 0xFF1C2130, 0xFF0B0D13, 0xFF181C28, 0xFF2A3145, 0xFFF1F4FB, 0xFF8F99B1, 0xFF5B8DEF, 0xFF2A4C94, 0xFF232A3C, 0xFF0D1018, 0xFF131722, 0xFF0C0E14, 0xFF121521, 0xFFE6EAF2, -496260, -5377643, -14848, -8750470, -8071433);\n"
           "    private static final List<Theme> builtIn = CollectionsKt.listOf(new Theme[]{AURORA, DARK, LIGHT, MIDNIGHT, HIGH_CONTRAST});")

          # 2) Aurora is the default theme (was High Contrast).
          edit("core/Settings.java",
           'return s("theme", "High Contrast");',
           'return s("theme", "Aurora");')

          # 3) Rounder buttons, tabs and input fields.
          edit("ui/Ui.java", "f = 4.0f;", "f = 10.0f;")
          edit("ui/Ui.java", "setCornerRadius(INSTANCE.dp(ctx, 3.0f))", "setCornerRadius(INSTANCE.dp(ctx, 8.0f))", count=2)

          # 4) Show the reason when a Roblox asset (mesh) fails to download.
          edit("net/AssetFetcher.java",
           "            concurrentHashMap.put(lValueOf, message);",
           "            String prevErr = concurrentHashMap.put(lValueOf, message);\n"
           "            if (!message.equals(prevErr)) {\n"
           "                com.goydevv.studrblx.core.OutputLog.INSTANCE.warn(\"Asset \" + $id + \" download failed: \" + message);\n"
           "            }")

          # 5) Start screen: recolour to the Aurora palette (it had its own hardcoded grey colours).
